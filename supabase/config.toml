# Supabase / Lovable Cloud project config.
# project_id is filled in by Lovable when the backend is enabled — see
# docs/COURSE_PLATFORM_SETUP.md §1.
project_id = ""

# ---------------------------------------------------------------------------
# Edge functions
# ---------------------------------------------------------------------------
# verify_jwt = false means the function is reachable without a Supabase session.
# Each one below authenticates by its own means; none of them trust the caller.

[functions.create-checkout]
# Signed-out visitors must be able to buy — Stripe Checkout collects the email
# and the webhook provisions the account. The function reads price data
# server-side from the products table; the client only sends a product slug.
verify_jwt = false

[functions.stripe-webhook]
# Called by Stripe, not by a user. Authenticated by Stripe signature
# verification against STRIPE_WEBHOOK_SECRET.
verify_jwt = false

[functions.lead-magnet]
# Public email capture for the free chapter.
verify_jwt = false

[functions.get-media-url]
# Gated media. Requires a valid session AND a server-side entitlement check.
verify_jwt = true
